spring.application.name=SmartChef

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=${DB_SCHEMA}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

server.port=8080

spring.jackson.time-zone=Europe/Madrid

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=-1
app.storage.dir=${STORAGE_DIR:uploads}

app.jwt.secreto=${JWT_SECRET}
app.jwt.expiracion-minutos=60

app.tareas.caducidad.cron=0 0 9 * * *
app.tareas.resumen.cron=0 0 9 * * MON

springdoc.swagger-ui.path=/swagger-ui.html
